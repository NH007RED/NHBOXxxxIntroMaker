function scheduleMarvelAudio(ctx, baseTime) {
  var master = ctx.createGain();
  master.gain.setValueAtTime(0.90, baseTime);
  master.connect(ctx.destination);

  var comp = ctx.createDynamicsCompressor();
  comp.threshold.setValueAtTime(-14, baseTime);

    { f: 329.63, t: 4.35, d: 3.40, v: 0.34 }

    flt.frequency.setValueAtTime(320, t0);
    flt.frequency.exponentialRampToValueAtTime(1950, t0 + 0.18);
    flt.frequency.exponentialRampToValueAtTime(680, t0 + n.d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(n.v, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.d);
    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(comp);
    o1.start(t0); o1.stop(t0 + n.d + 0.05); o2.start(t0); o2.stop(t0 + n.d + 0.05);
  });

  // 3. Massive Red Box Slam Impact & Orchestral Chord at 4.35s

  sub.type = "sine"; sub.frequency.setValueAtTime(115, tSlam);
  sub.frequency.exponentialRampToValueAtTime(38, tSlam + 0.28);
  subG.gain.setValueAtTime(0.95, tSlam);
  subG.gain.exponentialRampToValueAtTime(0.0001, tSlam + 3.2);
  sub.connect(subG); subG.connect(comp);
  sub.start(tSlam); sub.stop(tSlam + 3.3);

  [55.00, 82.41, 110.00, 138.59, 164.81, 220.00].forEach(function(cf, idx) {
    var p1 = ctx.createOscillator(), p2 = ctx.createOscillator(), flt = ctx.createBiquadFilter(), g = ctx.createGain();

    u32(0x46464952); u32(len - 8); u32(0x45564157); u32(0x20746d66); u32(16); u16(1); u16(numOfChan);
    u32(buf.sampleRate); u32(buf.sampleRate * 2 * numOfChan); u16(numOfChan * 2); u16(16); u32(0x61746164); u32(len - pos - 4);
    for (var i = 0; i < numOfChan; i++) ch.push(buf.getChannelData(i));

// Stage 1: Rapid 3D Flipbook of Real TMDB Movie Poster Pages (0.0s -> 4.15s)
function drawTMDBFlipbookMontage(T, alpha) {
  if (alpha <= 0.005 || TMDB_PAGES.length === 0) return;
  c.save();
  c.globalAlpha = cl(alpha, 0, 1);

  var flipSpeed = 14.5;
  var rawPage = T * flipSpeed;
  var baseIdx = Math.floor(rawPage) % TMDB_PAGES.length;
  var nextIdx = (baseIdx + 1) % TMDB_PAGES.length;
  var frac = rawPage - Math.floor(rawPage);

  var drift = 1.12 + 0.06 * Math.sin(T * 1.5);
  c.save();
  c.translate(CX, CY);
  c.rotate(Math.sin(T * 2.1) * 0.035);
  c.scale(drift, drift);
  c.drawImage(TMDB_PAGES[nextIdx], -W / 2, -H / 2, W, H);
  c.restore();

  // Actively flipping top page folding downward in 3D perspective
  c.save();
  c.translate(CX, CY + H * 0.45);
  var foldY = Math.cos(frac * Math.PI * 0.92);
  var skewX = Math.sin(frac * Math.PI) * 0.18;
  c.transform(drift, 0, skewX, foldY * drift, 0, 0);
  c.translate(0, -H * 0.45);
  c.drawImage(TMDB_PAGES[baseIdx], -W / 2, -H / 2, W, H);

  c.fillStyle = "rgba(0, 0, 0, " + (Math.sin(frac * Math.PI) * 0.65) + ")";
  c.fillRect(-W / 2, -H / 2, W, H);
  c.restore();

  var vig = c.createRadialGradient(CX, CY, 220, CX, CY, 1120);
  vig.addColorStop(0.0, "rgba(236, 29, 36, 0.15)");
  vig.addColorStop(0.65, "rgba(90, 5, 10, 0.58)");
  vig.addColorStop(1.0, "rgba(10, 0, 2, 0.94)");
  c.fillStyle = vig;
  c.fillRect(0, 0, W, H);

  c.restore();
}

    c.fillRect(boxX, boxY, boxW, boxH);

    if (postSlamT < 2.2 && TMDB_PAGES.length > 0) {
      c.save();
      c.globalAlpha = (1 - postSlamT / 2.2) * 0.22;
      c.drawImage(TMDB_PAGES[0], boxX, boxY, boxW, boxH);
      c.restore();
    }

    c.strokeStyle = "rgba(255, 160, 165, 0.82)";
    c.lineWidth = 3.2;
    c.strokeRect(boxX + 1.5, boxY + 1.5, boxW - 3, boxH - 3);
    c.restore();
  }

  /* PASS 2: DEEP 3D BRUSHED GUNMETAL-CRIMSON EXTRUSION SIDES */
  var extVis = 1 - cl((T - 4.10) / 0.35, 0, 1);
  if (extVis > 0.01) {
    var maxD = 58 * extVis;
    var vx = Math.sin(T * 1.6) * 0.65 * extVis;
    var vy = 0.75 * extVis;
    for (var l = 26; l >= 1; l--) {
      var frac = l / 26;
      var sh = Math.round(18 + (1 - frac) * 95);
      c.fillStyle = "rgb(" + Math.min(255, sh + 48) + "," + sh + "," + (sh + 8) + ")";
      c.fillText(text, vx * maxD * frac, vy * maxD * frac);
    }
  }

  /* PASS 3: FRONT FACE OF "NH BOX" WITH REAL TMDB POSTERS INSIDE LETTERS! */
  c.save();
  c.fillStyle = "#FFFFFF";
  c.fillText(text, 0, 0);

  var innerPosterAlpha = 1 - cl((T - 3.95) / 0.50, 0, 1);
  if (innerPosterAlpha > 0.01 && TMDB_PAGES.length > 0) {
    lmCtx.globalCompositeOperation = "source-over";
    lmCtx.clearRect(0, 0, 960, 320);
    lmCtx.font = fontSpec;
    lmCtx.textAlign = "center";
    lmCtx.textBaseline = "middle";
    lmCtx.fillStyle = "#FFFFFF";
    lmCtx.fillText(text, 480, 160);

    lmCtx.globalCompositeOperation = "source-in";
    var pIdx = Math.floor(T * 14) % TMDB_PAGES.length;
    lmCtx.drawImage(TMDB_PAGES[pIdx], 0, 0, 960, 320);

    c.save();
    c.globalAlpha = innerPosterAlpha * 0.90;
    c.drawImage(letterMaskCanvas, -480, -160);
    c.restore();
  }

  c.strokeStyle = boxSlamP > 0.5 ? "#FFFFFF" : "rgba(255, 225, 225, 0.92)";
  c.lineWidth = 2.5;
  c.strokeText(text, 0, 0);

  // Specular Light Sheen across the Red Box after Slam
  if (T >= 4.40 && T <= 6.40) {
    var shP = seg(T, 4.40, 6.20);
    var shX = -boxW * 0.7 + shP * boxW * 1.4;
    c.save();
    c.beginPath(); c.rect(boxX, boxY, boxW, boxH); c.clip();
    var shG = c.createLinearGradient(shX - 95, boxY, shX + 95, boxY + boxH);
    shG.addColorStop(0, "rgba(255,255,255,0)");
    shG.addColorStop(0.5, "rgba(255,255,255,0.68)");
    shG.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = shG;
    c.fillRect(boxX, boxY, boxW, boxH);
    c.restore();
  }
  c.restore();

  /* PASS 4: OFFICIAL MARVEL "S T U D I O S" FLANKING BARS */
  if (T >= 4.38) {
    var stP = easeOutCubic(seg(T, 4.38, 5.10));
    c.save();
    c.globalAlpha = stP;
    c.translate(0, boxH / 2 + 52);

    var lw = 220 * stP;
    c.strokeStyle = "#FFFFFF";
    c.lineWidth = 3.5;
    c.beginPath();
    c.moveTo(-390, 0); c.lineTo(-390 + lw, 0);
    c.moveTo(390 - lw, 0); c.lineTo(390, 0);
    c.stroke();

    c.font = "800 32px 'Montserrat', sans-serif";
    c.fillStyle = "#FFFFFF";
    c.shadowColor = "rgba(236, 29, 36, 0.8)";
    c.shadowBlur = 16;
    c.textAlign = "center";
    c.textBaseline = "middle";
    try { c.letterSpacing = "18px"; } catch(e) {}
    c.fillText("STUDIOS", 9, 1);
    c.restore();
  }

  c.restore();
}

function drawSubtitles(T) {
  var cap = document.getElementById("cap");
  if (cap && !cap.checked) return;
  var cur = T < 4.2 ? PLAN[0] : PLAN[1];
  var txt = SC[cur.i].vo;
  var st = T - cur.start;
  var a = cl(st / 0.3, 0, 1) * (1 - cl((st - (cur.len - 0.4)) / 0.4, 0, 1));
  if (a <= 0.01) return;

  c.save();
  c.globalAlpha = a;
  c.font = "600 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  c.textAlign = "center";
  c.textBaseline = "middle";
  var tw = c.measureText(txt).width + 44;
  c.fillStyle = "rgba(18, 4, 6, 0.85)";
  c.strokeStyle = "rgba(236, 29, 36, 0.55)";
  c.lineWidth = 1.5;
  c.fillRect(CX - tw / 2, H - 108, tw, 48);
  c.strokeRect(CX - tw / 2, H - 108, tw, 48);
  c.fillStyle = "#FFFFFF";
  c.fillText(txt, CX, H - 84);
  c.restore();
}

/* ==========================================================================
   5. MASTER TIMELINE FRAME RENDERER: frameAt(T)
   ========================================================================== */
var prevLiveT = 4.85;

function frameAt(T) {
  c.fillStyle = "#080203";
  c.fillRect(0, 0, W, H);

  var boost = T >= 4.30 ? Math.sin(seg(T, 4.30, 7.50) * Math.PI) * 0.25 : 0;
  var bg = c.createRadialGradient(CX, CY, 20, CX, CY, 960);
  bg.addColorStop(0.0, "rgba(236, 29, 36, " + (0.28 + boost) + ")");
  bg.addColorStop(0.45, "rgba(110, 8, 14, 0.24)");
  bg.addColorStop(1.0, "rgba(5, 1, 2, 0)");
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);

  var sx = 0, sy = 0;
  if (T >= 4.35 && T <= 4.85) {
    var d = 1 - (T - 4.35) / 0.50;
    sx = Math.sin((T - 4.35) * 48) * 12 * d;
    sy = Math.cos((T - 4.35) * 56) * 9 * d;
  }

  c.save();
  c.translate(sx, sy);

  if (T < 4.20) {
    drawTMDBFlipbookMontage(T, 1 - easeInOutCubic(seg(T, 2.55, 4.15)));
  }

  drawMarvel3DLogo(T);

  // Impact Shockwave Ring at 4.35s
  if (T >= 4.30 && T <= 5.35) {
    var p = seg(T, 4.30, 5.35);
    c.save();
    c.globalCompositeOperation = "screen";
    c.strokeStyle = "rgba(255, 70, 75, " + ((1 - p) * 0.65) + ")";
    c.lineWidth = (1 - p) * 12;
    c.beginPath();
    c.ellipse(CX, CY - 12, 250 + p * 950, (250 + p * 950) * 0.42, 0, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }

  c.restore();
  drawSubtitles(T);

  var te = document.getElementById("timing");
  if (te) te.textContent = T.toFixed(2) + "s / " + TOTAL.toFixed(2) + "s [60 FPS]";
  prevLiveT = T;
}

/* ==========================================================================
   6. UI CONTROLS
   ========================================================================== */
var isPlaying = false, playStart = 0, rafId = null;
var pvBtn = document.getElementById("pv"), replayBtn = document.getElementById("btnReplay");
var scSel = document.getElementById("scSel"), fsBtn = document.getElementById("btnFs"), dlBtn = document.getElementById("dl");
var stEl = document.getElementById("st");

PLAN.forEach(function(p, i) {
  var o = document.createElement("option");
  o.value = p.start;
  o.textContent = "Scene " + (i + 1) + ": " + (i === 0 ? "Live TMDB Poster Flip & 3D Extrusion" : "Marvel Red Box Slam & Fanfare Lockup");
  scSel.appendChild(o);
});

function playAt(offset) {
  getAudioContext();
  isPlaying = true;
  pvBtn.textContent = "⏸ Pause";
  stEl.textContent = "Status: Playing Ultra-Realistic Marvel TMDB Intro...";
  playStart = performance.now() - offset * 1000;

  if (document.getElementById("sf").checked && actx && offset <= 0.1) {
    scheduleMarvelAudio(actx, actx.currentTime - offset);
  }

  function loop() {
    if (!isPlaying) return;
    var t = (performance.now() - playStart) / 1000;
    if (t >= TOTAL) { frameAt(TOTAL); stopPlay(); stEl.textContent = "Status: Completed."; return; }
    frameAt(t);
    rafId = requestAnimationFrame(loop);
  }
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function stopPlay() {
  isPlaying = false;
  pvBtn.textContent = "▶ Preview Chalao";
  if (rafId) cancelAnimationFrame(rafId);
}

pvBtn.onclick = function() { isPlaying ? stopPlay() : playAt(0); };
replayBtn.onclick = function() { stopPlay(); playAt(2.80); };
scSel.onchange = function() { stopPlay(); playAt(parseFloat(this.value) || 0); };
fsBtn.onclick = function() { !document.fullscreenElement ? cv.requestFullscreen() : document.exitFullscreen(); };
dlBtn.onclick = function() {
  stEl.textContent = "Status: Rendering 16-bit WAV...";
  renderSfxWav(function(b) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "nh_box_marvel_realistic_tmdb_sfx.wav";
    a.click();
    stEl.textContent = "Status: WAV Downloaded!";
  });
};

frameAt(4.85);
</script>
