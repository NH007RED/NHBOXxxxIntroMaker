function scheduleHotstarAudio(ctx, baseTime) {
  var master = ctx.createGain();
  master.gain.setValueAtTime(0.88, baseTime);
  master.connect(ctx.destination);

  var comp = ctx.createDynamicsCompressor();

  [392.00, 493.88, 587.33, 739.99, 783.99, 987.77, 1174.66, 1479.98, 1567.98].forEach(function(freq, idx) {
    var tN = baseTime + 0.30 + idx * 0.14;
    var o = ctx.createOscillator(), g = ctx.createGain();

  af.frequency.setValueAtTime(300, baseTime + 2.30);
  af.frequency.exponentialRampToValueAtTime(3400, baseTime + 3.25);
  af.frequency.exponentialRampToValueAtTime(900, baseTime + 3.95);
  var ag = ctx.createGain();
  ag.gain.setValueAtTime(0.0001, baseTime + 2.30);
  ag.gain.linearRampToValueAtTime(0.24, baseTime + 3.20);
  ag.gain.exponentialRampToValueAtTime(0.0001, baseTime + 4.00);
  aw.connect(af); af.connect(ag); ag.connect(comp);
  aw.start(baseTime + 2.30, 0, 1.8);

    o1.type = "sawtooth"; o2.type = "triangle";

function renderSfxWav(cb) {
  var off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, 44100 * 8.5, 44100);
  scheduleHotstarAudio(off, 0);
  off.startRendering().then(function(buf) {
    var numOfChan = buf.numberOfChannels, len = buf.length * numOfChan * 2 + 44;
    var out = new DataView(new ArrayBuffer(len)), ch = [], pos = 0, offset = 0;
    function u16(d) { out.setUint16(pos, d, true); pos += 2; }
    function u32(d) { out.setUint32(pos, d, true); pos += 4; }
    u32(0x46464952); u32(len - 8); u32(0x45564157); u32(0x20746d66); u32(16); u16(1); u16(numOfChan);
    u32(buf.sampleRate); u32(buf.sampleRate * 2 * numOfChan); u16(numOfChan * 2); u16(16); u32(0x61746164); u32(len - pos - 4);
    for (var i = 0; i < numOfChan; i++) ch.push(buf.getChannelData(i));
    while (offset < buf.length) {
      for (var cIdx = 0; cIdx < numOfChan; cIdx++) {
        var s = Math.max(-1, Math.min(1, ch[cIdx][offset]));
        out.setInt16(pos, (s < 0 ? s * 32768 : s * 32767) | 0, true); pos += 2;
      }
      offset++;
    }
    cb(new Blob([out], { type: "audio/wav" }));
  });
}

/* ==========================================================================

// Draws Floating Starlight Constellation of Live TMDB Movie Posters in Night Sky
function drawTMDBStarlightConstellation(T, alpha) {
  if (alpha <= 0.005 || TMDB_POSTERS.length === 0) return;
  c.save();
  for (var i = 0; i < 10; i++) {
    var img = TMDB_POSTERS[i % TMDB_POSTERS.length];
    if (!img) continue;
    var angle = (i / 10) * Math.PI * 2 + T * 0.08;
    var rx = 620 + (i % 2) * 180;
    var ry = 280 + (i % 3) * 70;
    var px = CX + Math.cos(angle) * rx;
    var py = CY - 30 + Math.sin(angle) * ry;
    var sc = 0.45 + 0.25 * Math.sin(angle);

    c.save();
    c.translate(px, py);
    c.rotate(Math.sin(T * 0.5 + i) * 0.08);
    c.scale(sc, sc);
    c.globalAlpha = alpha * 0.34;
    c.shadowColor = "#00C8FF";
    c.shadowBlur = 24;
    try { c.drawImage(img, -90, -135, 180, 270); } catch(e) {}
    c.strokeStyle = "rgba(0, 240, 255, 0.65)";
    c.lineWidth = 3;
    c.strokeRect(-90, -135, 180, 270);
    c.restore();
  }
  c.restore();
}

function drawHotstarStarEmblem(cx, cy, scale, alpha, rot) {
  if (alpha <= 0.005 || scale <= 0.005) return;
  c.save();
  c.translate(cx, cy);
  c.scale(scale, scale);
  c.rotate(rot || 0);
  c.globalAlpha = cl(alpha, 0, 1);

  var spikes = 5, outerR = 54, innerR = 21;
  for (var i = 0; i < spikes; i++) {
    var a0 = (i * 2 * Math.PI) / spikes - Math.PI / 2;
    var a1 = a0 + Math.PI / spikes, a2 = a0 - Math.PI / spikes;
    var tx = Math.cos(a0) * outerR, ty = Math.sin(a0) * outerR;
    var rx = Math.cos(a1) * innerR, ry = Math.sin(a1) * innerR;
    var lx = Math.cos(a2) * innerR, ly = Math.sin(a2) * innerR;

    var f1 = c.createLinearGradient(0, 0, tx, ty);
    f1.addColorStop(0, "#FFFFFF"); f1.addColorStop(0.5, "#FFE57F"); f1.addColorStop(1, "#FFB300");
    c.fillStyle = f1;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(lx, ly); c.lineTo(tx, ty); c.closePath(); c.fill();

    var f2 = c.createLinearGradient(0, 0, rx, ry);
    f2.addColorStop(0, "#FFE066"); f2.addColorStop(0.6, "#FF9800"); f2.addColorStop(1, "#E65100");
    c.fillStyle = f2;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(tx, ty); c.lineTo(rx, ry); c.closePath(); c.fill();
  }
  c.restore();
}

function drawDisneyHotstarWordmark(text, cx, cy, revealP, lockP, sweepPos, plusP) {
  var chars = text.split("");
  var widths = [132, 132, 60, 128, 138, 130], gap = 12, totalW = 0;
  for (var k = 0; k < widths.length; k++) totalW += widths[k];
  totalW += (chars.length - 1) * gap;

  var startX = -totalW / 2 + 25;
  var fontSize = 176;
  var fontSpec = "900 " + fontSize + "px 'Montserrat', 'Segoe UI', sans-serif";
  var scale = 1.22 - 0.22 * easeOutCubic(lockP);

  c.save();
  c.translate(cx, cy);
  c.scale(scale, scale);

  // Hotstar 5-pointed gold starburst emblem on left
  var starX = startX - 92, starY = -6;
  drawHotstarStarEmblem(starX, starY, easeOutBack(cl((revealP - 0.05) / 0.75, 0, 1)), cl(revealP * 1.4, 0, 1), (1 - easeOutCubic(lockP)) * -0.8);

  var curX = startX;
  for (var i = 0; i < chars.length; i++) {
    var ch = chars[i], cw = widths[i];
    var lx = curX + cw / 2;
    curX += cw + gap;
    if (ch === " ") continue;

    var delay = i * 0.075;
    var p = cl((revealP - delay) / (1 - delay * 0.55), 0, 1);
    if (p <= 0.001) continue;

    var eP = easeOutCubic(p), eLock = easeInOutCubic(lockP);
    var normX = lx / (totalW * 0.5);

    c.save();
    c.translate(lx, (1 - eP) * 50);
    c.scale(0.65 + 0.35 * eP, 1.0);
    c.globalAlpha = cl(p * 1.3, 0, 1);
    c.font = fontSpec;
    c.textAlign = "center";
    c.textBaseline = "middle";

    var depth = (1 - eLock * 0.68) * 22 + 5;
    for (var l = 16; l >= 1; l--) {
      var frac = l / 16;
      if (l === 16) {
        c.fillStyle = "rgba(0, 225, 255, 0.5)";
        c.shadowColor = "#00C8FF";
        c.shadowBlur = 24;
      } else {
        c.shadowBlur = 0;
        var rC = Math.round(2 + (1 - frac) * 18);
        var gC = Math.round(42 + (1 - frac) * 115);
        var bC = Math.round(110 + (1 - frac) * 145);
        c.fillStyle = "rgb(" + rC + "," + gC + "," + bC + ")";
      }
      c.fillText(ch, -normX * depth * frac * (1 - eLock * 0.45), depth * 0.55 * frac * (1 - eLock * 0.45));
    }

    var fg = c.createLinearGradient(0, -fontSize * 0.5, 0, fontSize * 0.5);
    fg.addColorStop(0.0, "#FFFFFF");
    fg.addColorStop(0.55, "#F4FAFF");
    fg.addColorStop(1.0, "#94DEFF");
    c.shadowColor = "rgba(0, 180, 255, 0.65)";
    c.shadowBlur = 20;
    c.fillStyle = fg;
    c.fillText(ch, 0, 0);
    c.shadowBlur = 0;

    if (sweepPos >= 0 && sweepPos <= 1.2) {
      var swX = (sweepPos * 2.2 - 1.1) * (totalW * 0.55);
      if (Math.abs(swX - lx) < 130) {
        c.strokeStyle = "rgba(255,255,255," + ((1 - Math.abs(swX - lx) / 130) * 0.9) + ")";
        c.lineWidth = 3.6;
        c.strokeText(ch, 0, 0);
      }
    }
    c.restore();
  }

  // "+" Symbol at Top-Right
  var plusX = startX + totalW + 44, plusY = -46;
  if (plusP > 0.001) {
    var ps = easeOutBack(cl(plusP, 0, 1));
    c.save();
    c.translate(plusX, plusY);
    c.scale(ps, ps);
    c.shadowColor = "#00F0FF";
    c.shadowBlur = 28;
    c.fillStyle = "#FFFFFF";
    c.fillRect(-36, -6.5, 72, 13);
    c.fillRect(-6.5, -36, 13, 72);
    c.restore();
  }

  c.restore();
  return {
    startX: cx + (startX - 45) * scale,
    startY: cy + 15 * scale,
    endX: cx + plusX * scale,
    endY: cy + plusY * scale
  };
}

function drawShootingStarArch(x0, y0, x1, y1, archP, settleP, T) {
  if (archP <= 0.005) return;
  var p = easeInOutCubic(cl(archP, 0, 1));
  var fade = 1 - cl(settleP || 0, 0, 1) * 0.35;
  var cpX = (x0 + x1) * 0.48, cpY = Math.min(y0, y1) - 340;

  function pt(u) {
    var inv = 1 - u;
    return {
      x: inv * inv * x0 + 2 * inv * u * cpX + u * u * x1,
      y: inv * inv * y0 + 2 * inv * u * cpY + u * u * y1
    };
  }

  c.save();
  c.globalCompositeOperation = "screen";

  var segs = 75, maxS = Math.max(2, Math.floor(segs * p));
  for (var i = 1; i <= maxS; i++) {
    var u0 = (i - 1) / segs, u1 = Math.min(p, i / segs);
    var p0 = pt(u0), p1 = pt(u1);
    var lw = 2.0 + Math.sin(u1 * Math.PI) * 11.5;

    c.strokeStyle = "rgba(0, 195, 255, " + (0.45 * fade * (0.3 + 0.7 * u1)) + ")";
    c.lineWidth = lw * 2.4;
    c.lineCap = "round";
    c.beginPath(); c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y); c.stroke();

    c.strokeStyle = u1 > 0.75 ? "#FFFFFF" : "#70F4FF";
    c.lineWidth = lw * 0.65;
    c.beginPath(); c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y); c.stroke();
  }

  for (var d = 0; d < PIXIE.length; d++) {
    var pd = PIXIE[d];
    if (p >= pd.u) {
      var age = (p - pd.u) * 2.2 + (settleP || 0) * 1.2;
      if (age > 0 && age < pd.life) {
        var lf = age / pd.life, orig = pt(pd.u);
        c.globalAlpha = cl((1 - lf) * fade, 0, 1);
        c.fillStyle = pd.col;
        c.beginPath();
        c.arc(orig.x + pd.vx * age, orig.y + pd.vy * age, pd.sz * (1 - lf * 0.5), 0, Math.PI * 2);
        c.fill();
      }
    }
  }

  var head = pt(p);
  var fx = p < 0.99 ? head.x : x1;
  var fy = p < 0.99 ? head.y : y1;
  var fg = c.createRadialGradient(fx, fy, 0, fx, fy, 75);
  fg.addColorStop(0, "#FFFFFF");
  fg.addColorStop(0.3, "#00F0FF");
  fg.addColorStop(1, "rgba(0,0,0,0)");
  c.globalAlpha = cl(fade, 0, 1);
  c.fillStyle = fg;
  c.beginPath(); c.arc(fx, fy, 75, 0, Math.PI * 2); c.fill();

  c.restore();
}

function drawSubtitles(T) {
  var cap = document.getElementById("cap");
  if (cap && !cap.checked) return;
  var cur = T < 4.0 ? PLAN[0] : PLAN[1];
  var txt = SC[cur.i].vo;
  var st = T - cur.start;
  var a = cl(st / 0.3, 0, 1) * (1 - cl((st - (cur.len - 0.4)) / 0.4, 0, 1));
  if (a <= 0.01) return;

  c.save();
  c.globalAlpha = a;
  c.font = "600 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  c.textAlign = "center";
  c.textBaseline = "middle";
  var tw = c.measureText(txt).width + 44;
  c.fillStyle = "rgba(3, 10, 26, 0.84)";
  c.strokeStyle = "rgba(0, 200, 255, 0.5)";
  c.lineWidth = 1.5;
  c.fillRect(CX - tw / 2, H - 108, tw, 48);
  c.strokeRect(CX - tw / 2, H - 108, tw, 48);
  c.fillStyle = "#FFFFFF";
  c.fillText(txt, CX, H - 84);
  c.restore();
}

/* ==========================================================================
   6. MASTER TIMELINE FRAME RENDERER: frameAt(T)
   ========================================================================== */
var prevLiveT = 4.45;

function frameAt(T) {
  var sky = c.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.0, "#010510");
  sky.addColorStop(0.5, "#030E28");
  sky.addColorStop(1.0, "#020818");
  c.fillStyle = sky;
  c.fillRect(0, 0, W, H);

  var boost = Math.sin(seg(T, 3.6, 6.4) * Math.PI);
  var rad = c.createRadialGradient(CX, CY - 15, 20, CX, CY, 920);
  rad.addColorStop(0.0, "rgba(0, 195, 255, " + (0.34 + 0.24 * boost) + ")");
  rad.addColorStop(0.35, "rgba(0, 99, 229, 0.28)");
  rad.addColorStop(1.0, "rgba(1, 5, 16, 0)");
  c.fillStyle = rad;
  c.fillRect(0, 0, W, H);

  // Twinkling stars
  for (var i = 0; i < STARS.length; i++) {
    var st = STARS[i];
    c.fillStyle = "#FFFFFF";
    c.globalAlpha = 0.3 + 0.7 * Math.sin(T * st.sp + st.ph);
    c.beginPath(); c.arc(st.x, st.y, st.r, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;

  // Live TMDB Starlight Poster Constellation in the Magical Night Sky
  drawTMDBStarlightConstellation(T, seg(T, 0.3, 1.5));

  var coords = { startX: CX - 420, startY: CY, endX: CX + 470, endY: CY - 60 };
  if (T >= 0.85) {
    coords = drawDisneyHotstarWordmark(
      "NH BOX", CX, CY - 15,
      seg(T, 0.85, 2.45),
      seg(T, 1.70, 3.40),
      seg(T, 3.90, 5.60),
      seg(T, 3.82, 4.35)
    ) || coords;
  }

  if (T >= 2.30) {
    drawDisneyShootingStarArch(
      coords.startX, coords.startY, coords.endX, coords.endY,
      seg(T, 2.30, 3.92), seg(T, 3.92, 5.50), T
    );
  }

  if (T >= 4.00) {
    var subA = easeOutCubic(seg(T, 4.00, 4.85));
    c.save();
    c.globalAlpha = subA;
    c.font = "800 24px 'Montserrat', sans-serif";
    c.fillStyle = "#FFE066";
    c.shadowColor = "rgba(0, 195, 255, 0.75)";
    c.shadowBlur = 14;
    c.textAlign = "center";
    try { c.letterSpacing = "14px"; } catch(e) {}
    c.fillText("H O T S T A R   S P E C I A L S", CX + 14, CY + 122);
    c.restore();
  }

  drawSubtitles(T);

  var te = document.getElementById("timing");
  if (te) te.textContent = T.toFixed(2) + "s / " + TOTAL.toFixed(2) + "s [60 FPS]";
  prevLiveT = T;
}

// Alias used inside frameAt
var drawDisneyShootingStarArch = drawShootingStarArch;

/* ==========================================================================
   7. UI CONTROLS
   ========================================================================== */
var isPlaying = false, playStart = 0, rafId = null;
var pvBtn = document.getElementById("pv"), replayBtn = document.getElementById("btnReplay");
var scSel = document.getElementById("scSel"), fsBtn = document.getElementById("btnFs"), dlBtn = document.getElementById("dl");
var stEl = document.getElementById("st");

PLAN.forEach(function(p, i) {
  var o = document.createElement("option");
  o.value = p.start;
  o.textContent = "Scene " + (i + 1) + ": " + (i === 0 ? "TMDB Constellation & 3D NH BOX" : "Shooting Star Arch & + Lockup");
  scSel.appendChild(o);
});

function playAt(offset) {
  getAudioContext();
  isPlaying = true;
  pvBtn.textContent = "⏸ Pause";
  stEl.textContent = "Status: Playing Ultra-Realistic Disney+ Hotstar Intro...";
  playStart = performance.now() - offset * 1000;

  if (document.getElementById("sf").checked && actx && offset <= 0.1) {
    scheduleHotstarAudio(actx, actx.currentTime - offset);
  }

  function loop() {
    if (!isPlaying) return;
    var t = (performance.now() - playStart) / 1000;
    if (t >= TOTAL) { frameAt(TOTAL); stopPlay(); stEl.textContent = "Status: Completed."; return; }
    frameAt(t);
    rafId = requestAnimationFrame(loop);
  }
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function stopPlay() {
  isPlaying = false;
  pvBtn.textContent = "▶ Preview Chalao";
  if (rafId) cancelAnimationFrame(rafId);
}

pvBtn.onclick = function() { isPlaying ? stopPlay() : playAt(0); };
replayBtn.onclick = function() { stopPlay(); playAt(2.20); };
scSel.onchange = function() { stopPlay(); playAt(parseFloat(this.value) || 0); };
fsBtn.onclick = function() { !document.fullscreenElement ? cv.requestFullscreen() : document.exitFullscreen(); };
dlBtn.onclick = function() {
  stEl.textContent = "Status: Rendering 16-bit WAV...";
  renderSfxWav(function(b) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "nh_box_disney_hotstar_realistic_sfx.wav";
    a.click();
    stEl.textContent = "Status: WAV Downloaded!";
  });
};

frameAt(4.45);
</script>
